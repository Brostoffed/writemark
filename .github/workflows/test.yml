name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run source, documentation, and browser checks
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: output/playwright/report
          retention-days: 14

  webkit-macos:
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright WebKit
        run: npx playwright install webkit

      - name: Run desktop and mobile WebKit contracts
        run: npx playwright test --project=webkit --project=mobile-safari

      - name: Upload WebKit Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-webkit-macos
          path: output/playwright/report
          retention-days: 14

  distribution-loading:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [module, readable]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the module and readable browser files
        run: npx playwright test tests/component.spec.js tests/rendering.spec.js --project=chromium
        env:
          WRITEMARK_TEST_BUILD: ${{ matrix.build }}
