name: Commit distribution

on:
  workflow_run:
    workflows: [Generate distribution]
    types: [completed]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: commit-dist-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  commit:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Always use trusted default-branch code in this job.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: distribution
          path: ${{ runner.temp }}/distribution
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Commit generated files to the current pull request source
        run: node scripts/commit-distribution.mjs "$DIST_DIRECTORY"
        env:
          DIST_DIRECTORY: ${{ runner.temp }}/distribution
          DIST_TOKEN: ${{ github.token }}
