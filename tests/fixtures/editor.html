<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Writemark Playwright fixture</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
    }

    writemark-editor {
      --md-editor-min-height: 240px;
    }
  </style>
</head>
<body>
  <main>
    <button id="before-editor" type="button">Before editor</button>
    <form id="editor-form">
      <writemark-editor
        id="editor"
        name="body"
        label="Body"
        mode="live"
        preview="none"
        placeholder="Write Markdown"
      ></writemark-editor>
      <input id="after-editor" type="text" aria-label="After editor">
      <button id="reset-form" type="reset">Reset form</button>
    </form>
    <output id="submitted-value"></output>
  </main>

  <script type="module">
    await import("../../dist/writemark-editor.js");
    await customElements.whenDefined("writemark-editor");

    const editor = document.querySelector("#editor");
    const form = document.querySelector("#editor-form");
    const trackedEvents = [
      "md-action",
      "md-before-change",
      "md-change",
      "md-completion-accept",
      "md-completion-close",
      "md-completion-open",
      "md-copy",
      "md-debug",
      "md-dirty-change",
      "md-file-drop",
      "md-file-paste",
      "md-input",
      "md-paste",
      "md-render",
      "md-selection-change",
      "md-cut"
    ];

    window.testEvents = [];
    window.testLiveSelection = element =>
      element._liveSelectionCandidates()[0]?.selection || null;
    window.testSetLiveRange = (element, range) => {
      const selection = window.testLiveSelection(element);
      if (!selection) return false;
      selection.removeAllRanges();
      if (typeof selection.setBaseAndExtent === "function") {
        selection.setBaseAndExtent(
          range.startContainer,
          range.startOffset,
          range.endContainer,
          range.endOffset
        );
      } else {
        selection.addRange(range);
      }
      return true;
    };
    for (const type of trackedEvents) {
      editor.addEventListener(type, event => {
        const detail = event.detail || {};
        window.testEvents.push({
          type,
          actionId: detail.actionId,
          changes: detail.changes,
          dirty: detail.dirty,
          deferredAttempt: detail.deferredAttempt,
          focusRequired: detail.focusRequired,
          inputType: detail.inputType,
          key: detail.key,
          kind: detail.kind,
          level: detail.level,
          markdown: detail.markdown,
          metadataSynced: detail.metadataSynced,
          phase: detail.phase,
          providerId: detail.providerId,
          reason: detail.reason,
          selection: detail.selection,
          selectionAfter: detail.selectionAfter,
          selectionChannel: detail.selectionChannel,
          selectionChannels: detail.selectionChannels,
          selectionReadStrategy: detail.selectionReadStrategy,
          selectionStrategy: detail.selectionStrategy,
          selectionVerification: detail.selectionVerification,
          sequence: detail.sequence,
          source: detail.source,
          targetSelection: detail.targetSelection,
          value: detail.value
        });
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      document.querySelector("#submitted-value").value =
        new FormData(form).get("body") ?? "";
    });

    await new Promise(requestAnimationFrame);
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
